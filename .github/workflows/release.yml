name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to package, for example v0.4.0
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: The tag matches the engine version
        id: version
        run: |
          version="$(sed -n 's/.*current = "\(.*\)".*/\1/p' Sources/AWCore/EngineVersion.swift)"
          test "$TAG" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package npm and mcpb
        run: scripts/package.sh

      - name: The packaged server answers
        run: |
          mkdir -p "$RUNNER_TEMP/prefix"
          npm install --prefix "$RUNNER_TEMP/prefix" -g "$PWD/dist/agent-widgets-${{ steps.version.outputs.version }}.tgz"
          test "$("$RUNNER_TEMP/prefix/bin/aw" --version)" = "${{ steps.version.outputs.version }}"
          "$RUNNER_TEMP/prefix/bin/aw" gallery
          "$RUNNER_TEMP/prefix/bin/aw" templates

      - name: Attach the packages to the release
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "See CHANGELOG.md."
          gh release upload "$TAG" dist/agent-widgets-*.mcpb dist/agent-widgets-*.tgz --clobber

      - name: Publish to npm
        id: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "agent-widgets@$VERSION" version > /dev/null 2>&1; then
            echo "agent-widgets@$VERSION is already on npm"
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish "dist/agent-widgets-$VERSION.tgz" --access public
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::NPM_TOKEN is not set and agent-widgets@$VERSION is not on npm: publish it, then run this workflow again for the MCP registry"
          fi

      - name: Publish to the MCP registry
        if: steps.npm.outputs.published == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in $(seq 1 12); do
            npm view "agent-widgets@$VERSION" version > /dev/null 2>&1 && break
            echo "waiting for npm to list agent-widgets@$VERSION ($attempt)"
            sleep 10
          done
          gh release download --repo modelcontextprotocol/registry --pattern "mcp-publisher_darwin_arm64.tar.gz" --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/mcp-publisher_darwin_arm64.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
          cd dist
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish
