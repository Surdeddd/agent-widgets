name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tools
        run: brew install xcodegen swiftlint

      - name: Lint
        run: swiftlint --strict

      - name: Kit tests
        run: swift test --package-path Kit

      - name: Engine tests
        run: swift test

      - name: Build aw
        run: swift build -c release --product aw

      - name: Preview every example
        working-directory: examples
        run: |
          for dir in widgets/*/; do
            ../.build/release/aw preview "$(basename "$dir")"
          done

      - name: Build the examples app without signing
        working-directory: examples
        run: ../.build/release/aw build --no-sign --configuration Debug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previews
          path: examples/.aw/previews/*/sheet.png
          if-no-files-found: ignore
